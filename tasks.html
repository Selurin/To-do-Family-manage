<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задачи</title>
  <link rel="stylesheet" href="newdn.css">
  <link rel="icon" type="image/png" href="img/favicon.png" />
</head>
<body>
  <div class="container">
    
    <header class="header">
      <div class="logo">
        <img src="img/usr_groups.svg" alt="вк">
        <div class="title">СЕМЬЯ ИВАНОВЫ</div>
      </div>
    </header>

    <main class="main">
      <div class="task-list">
        <div class="tabs">
          <button class="tab-btn active" onclick="showMyTasks()">Мои задачи</button>
          <button class="tab-btn" onclick="showAllTasks()">Все задачи</button>
        </div>

        <div id="my-tasks" class="tasks-section">
          <div class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
              <div class="task-title">Что-то там сделать</div>
              <div class="task-assignee">Кому: Вам | От: Мама</div>
            </div>
          </div>

          <div class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
              <div class="task-title">Что-то там сделать</div>
              <div class="task-assignee">Кому: Вам | От: Мама</div>
            </div>
          </div>

          <div class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
              <div class="task-title">Что-то там сделать</div>
              <div class="task-assignee">Кому: Вам | От: Мама</div>
            </div>
          </div>

          <button class="add-task-btn" onclick="location.href='new_tasks.html'">
            <img src="img/sum.svg" alt="добавить">
            <span>Добавить задачу</span>
          </button>
        </div>

        <div id="all-tasks" class="tasks-section" style="display: none;">
          <div class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
              <div class="task-title">Что-то там сделать</div>
              <div class="task-assignee">Кому: Вам | От: Мама</div>
            </div>
          </div>

          <div class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
              <div class="task-title">Что-то там сделать</div>
              <div class="task-assignee">Кому: Вам | От: Мама</div>
            </div>
          </div>

          <div class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
              <div class="task-title">Что-то там сделать</div>
              <div class="task-assignee">Кому: Вам | От: Мама</div>
            </div>
          </div>

          <button class="add-task-btn" onclick="location.href='new_tasks.html'">
            <img src="img/sum.svg" alt="добавить">
            <span>Добавить задачу</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <a href="tasks.html" class="nav-icon"><img src="img/home.svg" alt="домой"></a>
      <a href="profile.html" class="nav-icon"><img src="img/profile.svg" alt="профиль"></a>
      <a href="settings.html" class="nav-icon"><img src="img/settings.svg" alt="настройки"></a>
    </footer>

  </div>

  <script>
    function showMyTasks() {
      document.getElementById('my-tasks').style.display = 'block';
      document.getElementById('all-tasks').style.display = 'none';
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.querySelectorAll('.tab-btn')[1].classList.remove('active');
    }

    function showAllTasks() {
      document.getElementById('my-tasks').style.display = 'none';
      document.getElementById('all-tasks').style.display = 'block';
      document.querySelectorAll('.tab-btn')[0].classList.remove('active');
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
  </script>
</body>
</html>
